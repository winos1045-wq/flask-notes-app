<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='{{ url_for('static', filename='css/style.css') }}'>
    <title>Edit Note</title>
</head>
<body>
    <div class='container'>
        <h1>Edit Note</h1>
        <form method='POST'>
            <div class='form-group'>
                <label for='title'>Title</label>
                <input type='text' name='title' id='title' value='{{ note['title'] }}' required>
            </div>
            <div class='form-group'>
                <label for='content'>Content</label>
                <textarea name='content' id='content' rows='5' required>{{ note['content'] }}</textarea>
            </div>
            <button type='submit' class='btn-primary'>Update Note</button>
            <a href='{{ url_for('index') }}' class='btn-secondary'>Cancel</a>
        </form>
    </div>
</body>
</html>
